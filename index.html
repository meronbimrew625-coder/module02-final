<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shop House</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Shop House</h1>
      <button class="wish-button">wishlist</button>
    </header>

    <main>
      <form id="searchForm" class="form-section">
        <input
          id="searchInput"
          type="text"
          placeholder="Search for a Product..."/>
     
        

        <button type="submit">Search</button>
      </form>

      <p id="message"></p>

      <section>
        <h2 id="title">Products</h2> 

        <div id="products" class="grid"></div>
      </section>

      <section>
        <h2>Wishlists</h2>

        <div id="wish-list" class="grid"></div>
      </section>
    </main>
    <footer class="footer"> 
      <p>© 2026 Shop House. 
        All Rights Reserved.</p> 
      </footer>

    <script src="script.js"></script>
  </body>
</html>
